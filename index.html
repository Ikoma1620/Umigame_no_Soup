<!DOCTYPE html>

<html lang="ja">

<html>
<head>
  <meta charset="UTF-8">
  <title>フォーム回答一覧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main-container">
    <!-- 左側 -->
    <div class="left-panel">
      <header>
        <h1>ウミガメさんとスープ</h1>
        <button class="qa-button" onclick="openQaOverlay()">Q&Aを開く</button>
      </header>

      <div class="question-display">
    <span style="
        display:inline-block;
        background:#1A9DC0;
        color:white;
        padding:3px 8px;
        border-radius:7px;
        font-size:12px;
        margin-right:10px;
        font-weight:bold;
    ">
        問題
    </span>

    <span id="mainQuestion">
        読み込み中...
    </span>
</div>

      <div class="filter-container">
        <strong>絞り込み</strong><br>
        <label>正誤:
          <select id="filterCorrectness">
            <option value="all">すべて</option>
            <option value="はい">はい</option>
            <option value="どちらでもない">どちらでもない</option>
            <option value="いいえ">いいえ</option>
          </select>
        </label>
        <label>関連度:
          <select id="filterQuality">
            <option value="all">すべて</option>
            <option value="いい質問">いい質問</option>
            <option value="関係ない">関係ない</option>
          </select>
        </label>
        <button id="filterButton" onclick="applyFilter()">
    適用
</button>
      </div>

<div id="tableWrapper">
    <table id="output"></table>
</div>
    </div>

    <!-- 右側 -->
    <div class="right-panel">
<div style="margin:12px;">

<strong>ニックネームで確認</strong>

<input
id="nicknameInput"
type="text"
placeholder="ニックネームを入力">

<button onclick="searchByNickname()">
確認する
</button>

<div
class="results"
id="nicknameResults">
</div>

</div>

      <!-- 👇 ここにGoogleフォームを埋め込み -->
      <div class="form-embed">

<iframe
src="https://forms.gle/PsjU6uP2qnVAz5738">
</iframe>

</div>
  </div>

  <div class="marquee">
    <span id="marqueeText"></span>
  </div>
